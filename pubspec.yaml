name: cl_gallery_viewer
description: Media gallery viewer — images, videos and PDFs, with mobile and desktop layouts, a thumbnail strip, a full-screen image viewer, highlight media and an uploader.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ">=3.10.0"

dependencies:
  # File picking for the uploader module
  file_picker: 8.3.7
  flutter:
    sdk: flutter
  # State management
  flutter_riverpod: 2.6.1
  # For MediaKitVideoPlayer
  media_kit: 1.2.6
  media_kit_libs_video: 1.0.7
  media_kit_video: 2.0.1
  # @immutable
  meta: 1.19.0
  # UI components
  shadcn_ui: 0.56.1
  # For NativeVideoPlayer
  video_player: 2.11.1
  # For gallery video player visibility tracking
  visibility_detector: 0.4.0+2
  # For HtmlVideoPlayer and OverlayVideoPlayer (web only)
  web: 1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: 10.3.0
  # Fake video_player platform in tests
  video_player_platform_interface: 6.9.0
